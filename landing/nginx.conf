# Serves the built static landing site, plus ONE proxied endpoint.
#
# Unlike playPro Stats' landing (pure static, contact over WhatsApp/mailto),
# Voxa's landing has a real contact form that POSTs to the backend. Two ways to
# wire that:
#
#   (a) cross-origin — the bundle calls https://app.<domain>/api/contact, which
#       needs CORS (LANDING_ORIGINS), a preflight on every submit, and an
#       absolute URL baked into the image at build time;
#   (b) same-origin — the bundle calls a relative /api/contact and nginx
#       forwards it to the backend over the internal Docker network.
#
# (b) is what this file does. No CORS at all, and the image carries no domain,
# so the same artifact runs on localhost, a staging host, or production.
#
# The proxy is an EXACT match on the single endpoint the landing uses, not a
# `location /api/` prefix. Least privilege: the apex has no business exposing
# the transcription and extraction endpoints — those are billable, and they are
# already reachable (rate-limited) through the app's own hostname. A prefix
# block here would publish the entire API on a second front door.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Required for the variable trick below; see there.
    # ipv6=off because it can hand back an AAAA record that nothing listens on.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # POST /api/contact — the only backend call the landing makes.
    # `= ` is an exact match: /api/contact and nothing below it.
    location = /api/contact {
        # The upstream goes through a VARIABLE on purpose. With a literal
        # hostname, nginx resolves it once at config-load time, which fails two
        # ways in production: (1) if the backend is not up yet, nginx refuses to
        # start at all — and `restart: unless-stopped` turns that into a crash
        # loop, taking a purely static marketing site down because an API is
        # slow; (2) after a redeploy the backend gets a new container IP and
        # nginx keeps proxying to the dead one forever, a 502 that only a manual
        # restart clears. A variable defers resolution to request time, so the
        # landing now serves fine with the backend down and only the contact form
        # fails — the failure is isolated to the feature that needs it.
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Appends this hop to the chain. Caddy already added the visitor's
        # address, so the backend sees two entries and reads the client from the
        # RIGHT by TRUSTED_PROXY_HOPS=2 — anything further left is caller-written
        # and forgeable. Getting that count wrong silently breaks rate limiting.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
