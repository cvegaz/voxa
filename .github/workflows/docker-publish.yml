# Builds the production images, publishes them to GHCR, and tells the server to
# pull and restart. Stage 1 of the deployment plan: the EC2 host only ever
# pulls — it never builds, never holds source, and never accepts an inbound
# deploy connection.
#
# Multi-arch on purpose: the server is ARM (t4g/Graviton) while local smoke
# tests run on amd64. One manifest serves both.
#
# GATED ON CI, unlike playPro Stats' equivalent. There, docker-publish triggers
# on `push: main` and races CI — both start at once, so a merge whose tests are
# still running (or already red) publishes and deploys anyway. That is not
# hypothetical: it happened on this repo's demo-limits PR, merged with 0 of 3
# checks finished. `workflow_run` makes the pipeline sequential: CI must
# conclude successfully before anything is built.

name: docker-publish

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The commit to build. On a workflow_run event `github.sha` points at the
# default branch's tip rather than the run's commit, so the head_sha of the
# triggering run is the honest answer; workflow_dispatch falls back.
env:
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  publish:
    # Skip unless CI actually passed on main. Without the conclusion check this
    # fires on failed runs too, since `types: [completed]` means "finished",
    # not "succeeded".
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: voxa-backend
            context: backend
            build_args: ""
          - name: voxa-frontend
            context: frontend
            build_args: ""
          - name: voxa-landing
            context: landing
            # Vite bakes VITE_* into the bundle at BUILD time, so the app link
            # is a build arg rather than runtime config. It lives here, not in
            # the Dockerfile, so the image stays domain-agnostic and the
            # deployment decides where "Try it yourself" points.
            #
            # VITE_API_BASE is deliberately absent: the landing calls
            # /api/contact same-origin through its own nginx, so there is no
            # CORS and no absolute URL to bake in.
            build_args: |
              VITE_APP_URL=https://app.tryvoxa.com
              VITE_GITHUB_URL=https://github.com/cvegaz/voxa
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      # QEMU emulates arm64 on the amd64 runner so one job builds both
      # architectures. Slower than a native ARM runner, and free.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.build_args }}
          platforms: linux/amd64,linux/arm64
          push: true
          # Two tags on every build: `latest` is what the server pulls, and the
          # SHA tag is what makes a rollback possible — pin
          # VOXA_*_IMAGE to a SHA in .env.production and restart.
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Once the images are on GHCR, tell the server to pull and restart — via AWS
  # SSM, authenticated with OIDC. No stored AWS keys, no inbound SSH, nothing
  # to rotate. The infra (the scoped role, the SSM policy) is in
  # infra/terraform/cicd.tf; the two `vars` below are plain identifiers, not
  # secrets — the OIDC trust condition is what actually gates access.
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write # mint the OIDC token AWS trusts
      contents: read
    steps:
      - name: Configure AWS credentials (OIDC — federated, no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: mx-central-1

      - name: Deploy — pull & restart on the server via SSM Run Command
        env:
          INSTANCE_ID: ${{ vars.SSM_INSTANCE_ID }}
        run: |
          set -euo pipefail
          # Run as `ubuntu` so docker uses that user's cached GHCR login and
          # its ~/voxa deploy directory.
          INNER='cd ~/voxa && docker compose -f docker-compose.prod.yml --env-file .env.production pull && docker compose -f docker-compose.prod.yml --env-file .env.production up -d'
          FULL="runuser -l ubuntu -c '$INNER'"
          # Build the JSON with python rather than string-concatenation: the
          # command contains quotes, and a hand-built payload breaks the moment
          # someone edits it.
          PARAMS=$(python3 -c "import json,sys;print(json.dumps({'commands':[sys.argv[1]]}))" "$FULL")

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "auto-deploy ${DEPLOY_SHA::7}" \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)
          echo "SSM CommandId: $CMD_ID"

          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text)
          echo "Deploy status: $STATUS"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text || true
          if [ "$STATUS" != "Success" ]; then
            echo "::error::Deploy command did not succeed"
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text || true
            exit 1
          fi
