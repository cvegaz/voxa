# Nginx configuration to serve the frontend (static React/Vite build)
# and forward API calls to the backend.

server {
    listen 80;
    server_name _;

    # Directory where the Dockerfile placed the `vite build` output.
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS resolver. Needed by the /api block below.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # --- Application (SPA) ---
    # React is a Single-Page App: routes (e.g. /schema) are resolved by the
    # browser, they do NOT exist as files on disk. So if Nginx cannot find the
    # requested file, it serves index.html and lets React handle the route.
    # Without this, reloading on a sub-route would return a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- API ---
    # Anything starting with /api/ is forwarded to the backend container.
    # "backend" is the service NAME in docker-compose: inside the Docker network,
    # that name resolves to the container's IP (internal DNS).
    #
    # NOTE: without a trailing "/" in proxy_pass, Nginx keeps the /api prefix,
    # which is exactly what the backend routes expect (/api/templates, /api/extraction...).
    #
    # The upstream goes through a VARIABLE (with the `resolver` above) rather
    # than a literal `http://backend:8000`. nginx resolves a literal hostname
    # ONCE, at config-load time, which breaks twice in production: if the
    # backend is not up yet nginx refuses to start (and `restart:
    # unless-stopped` makes that a crash loop), and after a redeploy the backend
    # gets a new container IP while nginx keeps the dead one cached — a
    # permanent 502 that only a manual restart clears. Deferring resolution to
    # request time fixes both: the SPA keeps serving and /api recovers on its
    # own once the backend is back.
    #
    # $request_uri is the full original path and query, so the /api prefix the
    # backend routes expect is preserved exactly as before.
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
