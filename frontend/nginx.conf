# Nginx configuration to serve the frontend (static React/Vite build)
# and forward API calls to the backend.

server {
    listen 80;
    server_name _;

    # Directory where the Dockerfile placed the `vite build` output.
    root /usr/share/nginx/html;
    index index.html;

    # --- Application (SPA) ---
    # React is a Single-Page App: routes (e.g. /schema) are resolved by the
    # browser, they do NOT exist as files on disk. So if Nginx cannot find the
    # requested file, it serves index.html and lets React handle the route.
    # Without this, reloading on a sub-route would return a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- API ---
    # Anything starting with /api/ is forwarded to the backend container.
    # "backend" is the service NAME in docker-compose: inside the Docker network,
    # that name resolves to the container's IP (internal DNS).
    #
    # NOTE: without a trailing "/" in proxy_pass, Nginx keeps the /api prefix,
    # which is exactly what the backend routes expect (/api/templates, /api/extraction...).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
