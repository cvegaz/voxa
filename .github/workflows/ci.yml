name: CI

# Run on every push to main and on pull requests targeting it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        # requirements-dev.txt: the pinned runtime set PLUS the test tooling.
        # Both files are generated by pip-compile, so this install is
        # reproducible — every version, transitive ones included, is fixed.
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # No secrets and no Postgres on purpose: the suite mocks the database and
        # OpenAI, and tests/test_offline_suite.py asserts that it can run with a
        # completely empty environment. If that guarantee ever breaks again, it
        # breaks here — which is the point of not providing a key.
        run: pytest

  frontend:
    name: Frontend (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  landing:
    name: Landing (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
