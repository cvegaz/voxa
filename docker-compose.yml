# ═════════════════════════════════════════════════════════════════════════════
# docker-compose.yml — the "orchestra conductor".
#
# Defines the 3 services (db, backend, frontend), builds them, connects them on
# a private network, and manages their lifecycle. Everything comes up with one
# command:
#
#     docker compose up --build
#
# ═════════════════════════════════════════════════════════════════════════════

# Project name. Without this, Compose would use the folder name (my_data_app) as
# the prefix for containers, network, and volumes. We pin it to "voxa" so
# everything shows up as voxa-backend-1, voxa-db-1, etc.
name: voxa

services:
  # ───────────────────────────── Database ─────────────────────────────
  db:
    image: postgres:16-alpine          # official image, nothing to build
    environment:
      # Postgres automatically creates this user and database on its FIRST
      # startup (when the volume is empty).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres       # local-development-only credential
      POSTGRES_DB: db_audio_excel
    ports:
      # HOST:CONTAINER. The host side comes from voxa's reserved block (53xx in
      # ~/Dev/PORTS.md): 5330 is the "+30 database" role. It used to be 5433,
      # which collides with clocky's Postgres — that port belongs to clocky.
      # The CONTAINER side stays 5432 and is NOT part of the registry: container
      # ports live in their own network namespace and never collide, which is why
      # the backend still connects to db:5432 unchanged.
      - "5330:5432"
    volumes:
      # Named volume: Postgres data lives here and SURVIVES `docker compose down`.
      # Without this, you would lose the database when the containers stop.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Checks that Postgres is accepting connections. The backend waits for this
      # to turn "healthy" before starting (see depends_on below).
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_audio_excel"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ──────────────────────────────── Backend ────────────────────────────────
  backend:
    build: ./backend                    # builds using backend/Dockerfile
    env_file:
      - ./backend/.env                  # loads OPENAI_API_KEY (your existing file)
    environment:
      # IMPORTANT: overrides DATABASE_URL from .env. Inside Docker the database is
      # NOT on "localhost" but on the "db" host (the service name).
      # `environment` takes precedence over `env_file`.
      DATABASE_URL: postgresql://postgres:postgres@db:5432/db_audio_excel
    ports:
      # 5310 = "+10 backend" in voxa's 53xx block. 8000 (the old host port) is a
      # default-magnet port the registry forbids. Container side stays 8000.
      - "5310:8000"                     # direct access to the API and to /docs (Swagger)
    # No file volume: the backend is stateless. The result .xlsx is rebuilt in
    # memory from the database on download (ADR-0013), never written to disk.
    depends_on:
      db:
        condition: service_healthy      # does not start until the database is ready
    # Before serving, apply pending migrations; then start uvicorn. We put it here
    # (and not in a .sh script) to avoid Windows CRLF line-ending issues that would
    # break a shebang inside the Linux container.
    command: sh -c "python scripts/migrate.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # ──────────────────────────────── Frontend ───────────────────────────────
  frontend:
    build: ./frontend                   # builds using frontend/Dockerfile (multi-stage)
    ports:
      # 5300 = "+00 primary frontend" in voxa's 53xx block. 8080 collided with
      # clocky and is a default-magnet port besides.
      - "5300:80"                       # opens the app at http://localhost:5300
    depends_on:
      - backend                         # starts after the backend

# Named volumes, managed by Docker. They persist data across restarts.
volumes:
  pgdata:
